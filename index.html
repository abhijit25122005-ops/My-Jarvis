<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
    <title>Jarvis AI Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #header {
            background-color: #161b22;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #00e676;
            border-bottom: 1px solid #30363d;
        }
        #chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg {
            padding: 12px 16px;
            border-radius: 15px;
            max-width: 75%;
            word-wrap: break-word;
            line-height: 1.4;
        }
        .user {
            background-color: #00e676;
            color: #000000;
            align-self: flex-end;
            font-weight: bold;
        }
        .bot {
            background-color: #21262d;
            color: #ffffff;
            align-self: flex-start;
            border: 1px solid #30363d;
        }
        #input-area {
            display: flex;
            padding: 10px;
            background-color: #161b22;
            border-top: 1px solid #30363d;
        }
        input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #30363d;
            border-radius: 25px;
            background-color: #0d1117;
            color: #ffffff;
            font-size: 16px;
            outline: none;
        }
        button {
            background-color: #00e676;
            color: #000000;
            border: none;
            padding: 12px 20px;
            margin-left: 10px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="header">🤖 My Jarvis AI</div>

    <div id="chat-box">
        <div class="msg bot">नमस्ते! मैं आपका Jarvis असिस्टेंट हूं। मैं आपकी क्या मदद कर सकता हूं?</div>
    </div>

    <div id="input-area">
        <input type="text" id="user-input" maxlength="500" placeholder="यहां अपना संदेश लिखें..." onkeypress="checkEnter(event)">
        <button onclick="sendMessage()">भेजें</button>
    </div>

    <script>
        function checkEnter(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }

        function sendMessage() {
            const inputField = document.getElementById("user-input");
            const userText = inputField.value.trim();

            if (userText === "") return;

            addMessage(userText, "user");
            inputField.value = "";

            setTimeout(() => {
                const botReply = generateReply(userText.toLowerCase());
                addMessage(botReply, "bot");
            }, 400);
        }

        function addMessage(text, sender) {
            const chatBox = document.getElementById("chat-box");
            const msgDiv = document.createElement("div");
            msgDiv.className = "msg " + sender;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function generateReply(msg) {
            if (msg.includes("<script>") || msg.includes("javascript:")) {
                return "⚠️ सुरक्षा चेतावनी: गलत कोड ब्लॉक कर दिया गया है।";
            }
            if (msg.includes("hello") || msg.includes("hi") || msg.includes("नमस्ते")) {
                return "नमस्ते! बताइए आज मैं आपके लिए क्या कर सकता हूं?";
            } 
            if (msg.includes("नाम") || msg.includes("name")) {
                return "मेरा नाम Jarvis AI है।";
            } 
            if (msg.includes("समय") || msg.includes("time")) {
                return "अभी समय है: " + new Date().toLocaleTimeString('hi-IN');
            } 
            if (msg.includes("तारीख") || msg.includes("date")) {
                return "आज की तारीख है: " + new Date().toLocaleDateString('hi-IN');
            }
            return "आपने कहा: '" + msg + "'। मैं अभी सीख रहा हूं, जल्द ही और स्मार्ट बनूंगा!";
        }
    </script>

</body>
</html>
