<title>Jarvis AI</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: phone-first cybernetic console. A particle core fills the stage, four circuit-linked cards sit in its corners,
   then avatar switch, one big Start/Terminate button, status, a short chat log and a sticky composer. Panels open as a bottom sheet.
   This design commits to one dark look on purpose, so there is no light variant. */
:root {
  --bg: #04070d;
  --panel: #0a1220;
  --panel-2: #101b30;
  --line: #1b2c47;
  --fg: #e6f1ff;
  --mute: #8aa0bd;
  --accent: #3ddcff;
  --accent-ink: #031018;
  --live: #ff6b7a;
  --warn: #ffb347;
  --font-display: "Orbitron", "Rajdhani", system-ui, sans-serif;
  --font-body: "Rajdhani", "Noto Sans Devanagari", "Noto Sans Bengali", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html { height: 100%; }
body {
  margin: 0; min-height: 100%;
  background: radial-gradient(120% 70% at 50% 0%, #0a1830 0%, var(--bg) 62%) var(--bg);
  color: var(--fg); font-family: var(--font-body); font-size: 18px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px; box-sizing: border-box;
}
[hidden] { display: none !important; }
.app { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; min-height: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font-family: inherit; }

.head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.head h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: .28em; color: var(--accent); }
.head .engine { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; letter-spacing: .05em; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--mute); background: transparent; }
.chip.ok { color: var(--accent); border-color: var(--accent); }
.chip.warn { color: var(--warn); border-color: var(--warn); }
button.chip { cursor: pointer; }

.stage { position: relative; width: 100%; aspect-ratio: 1 / 1.02; flex: none; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.node {
  position: absolute; width: min(41%, 170px); min-height: 56px; box-sizing: border-box;
  display: flex; align-items: center; gap: 10px; padding: 8px 12px; text-align: left; cursor: pointer;
  color: var(--fg); background: rgba(10, 18, 32, .82); border: 1px solid var(--line); border-radius: 12px;
  backdrop-filter: blur(6px); transition: border-color .2s, box-shadow .2s;
}
.node:hover, .node[aria-expanded="true"] { border-color: var(--accent); box-shadow: 0 0 18px -4px var(--accent); }
.node svg { flex: none; color: var(--accent); }
.node b { display: block; font-family: var(--font-display); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
.node small { display: block; color: var(--mute); font-size: 14px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.node .tx { min-width: 0; }
.node.tl { left: 0; top: 0; } .node.tr { right: 0; top: 0; } .node.bl { left: 0; bottom: 0; } .node.br { right: 0; bottom: 0; }

.seg { display: flex; align-self: center; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--panel); }
.seg button { border: 0; background: transparent; color: var(--mute); font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .16em; padding: 9px 16px; border-radius: 999px; cursor: pointer; min-height: 40px; }
.seg button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); }

.power {
  align-self: center; width: min(100%, 420px); height: 64px; border-radius: 18px; cursor: pointer;
  font-family: var(--font-display); font-weight: 800; font-size: 18px; letter-spacing: .24em; text-transform: uppercase;
  display: flex; align-items: center; justify-content: center; gap: 12px;
  background: color-mix(in srgb, var(--accent) 14%, var(--bg)); color: var(--accent); border: 2px solid var(--accent);
  box-shadow: 0 0 26px -6px var(--accent), inset 0 0 22px -12px var(--accent);
  animation: glow 2.6s ease-in-out infinite;
}
.power.running { color: var(--live); border-color: var(--live); background: color-mix(in srgb, var(--live) 12%, var(--bg)); box-shadow: 0 0 26px -8px var(--live); animation: none; }
@keyframes glow { 50% { box-shadow: 0 0 40px -2px var(--accent), inset 0 0 26px -8px var(--accent); } }

.statusrow { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.status { color: var(--mute); font-size: 17px; }
.live { min-height: 1.3em; color: var(--live); font-size: 16px; overflow-wrap: anywhere; }
.live.note { color: var(--warn); }
.skillchip { display: inline-flex; gap: 8px; align-items: center; }

.chat { max-height: 34vh; min-height: 90px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 2px; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); font-weight: 600; border-bottom-right-radius: 4px; }
.msg.assistant { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.error { border-color: var(--live); color: var(--live); }
.via { display: block; margin-top: 4px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
.dots { align-self: flex-start; display: flex; gap: 6px; padding: 12px 14px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: blink 1s infinite; }
.dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
.banner { margin: 0; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--warn); color: var(--warn); font-size: 16px; }

.composer { position: sticky; bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); padding-block: 8px; margin-top: auto; }
.compose-row { display: flex; gap: 8px; align-items: center; }
.compose-row input { flex: 1; min-width: 0; }
.round { flex: none; width: 52px; height: 52px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid var(--line); }
.mic { background: var(--panel); color: var(--accent); border-color: var(--accent); }
.mic.on { background: var(--live); color: #fff; border-color: var(--live); }
.mic.quiet { background: var(--warn); color: var(--accent-ink); border-color: var(--warn); }
.send { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.round:disabled { opacity: .4; cursor: not-allowed; }

input[type="text"], input[type="password"] {
  height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; width: 100%;
  background: var(--bg); color: var(--fg); border: 1px solid var(--line); font-family: var(--font-body); font-size: 18px;
}
input::placeholder { color: var(--mute); opacity: .8; }
input:disabled { opacity: .5; }
input[type="range"] { width: 100%; accent-color: var(--accent); }

.backdrop { position: fixed; inset: 0; background: rgba(2, 5, 10, .6); z-index: 19; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; max-height: 84vh; overflow-y: auto; box-sizing: border-box;
  background: var(--panel); border-top: 1px solid var(--accent); border-radius: 18px 18px 0 0;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet-in { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.sheet h2 { margin: 0; font-family: var(--font-display); font-size: 16px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
.sheet h3 { margin: 0; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); font-weight: 700; }
.sheethead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > input { flex: 1 1 160px; min-width: 0; width: auto; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 12px; background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); font-size: 16px; font-weight: 600; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.small { min-height: 36px; padding: 0 10px; font-size: 15px; }
.btn.danger { color: var(--live); }
.btn.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.hint { margin: 0; color: var(--mute); font-size: 15px; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.list li { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px 6px 6px 12px; }
.list li span.t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.kind { font-size: 12px; letter-spacing: .08em; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--mute); }
.box { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; }
.card { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 12px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); color: var(--fg); cursor: pointer; }
.card:hover, .card[aria-pressed="true"] { border-color: var(--accent); }
.card b { font-size: 18px; } .card span { color: var(--mute); font-size: 15px; }
@media (prefers-reduced-motion: reduce) { .power, .dots i { animation: none !important; } }
</style>
